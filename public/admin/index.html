<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Game Builds · Kult Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/art/brand/kw-favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  The game build editor: where each legacy game's play page, Unity build,
  download and per-mode builds live (the Kult backend's game records).
  Kult World's Game Hub and the Kult browser read them. Only wallets in the
  Kult backend's ADMIN_WALLETS can load or save.
-->
<style>
  :root {
    --bg: #0b0717; --panel: #140f2c; --panel-2: #1b1538; --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.18);
    --text: #f1edff; --muted: #b3a9da; --dim: #7d73a8; --cyan: #5ec8f2; --pink: #ff7eb6; --gold: #f2c14e; --green: #6ff0a6; --red: #ff6b7d;
    --display: "Chakra Petch", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% -10%, #241a52, var(--bg) 60%); color: var(--text); font: 14px/1.5 var(--body); }
  a { color: var(--cyan); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px clamp(16px, 4vw, 40px); background: rgba(11, 7, 23, 0.85); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
  header h1 { margin: 0; font: 700 16px var(--display); letter-spacing: 0.2em; text-transform: uppercase; }
  header h1 b { color: var(--cyan); }
  header .who { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 60px; }
  .intro { color: var(--muted); max-width: 760px; margin: 0 0 24px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.05); color: var(--text); font: 600 13px var(--display); letter-spacing: 0.06em; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--cyan); }
  .btn.primary { background: linear-gradient(135deg, #6b3fd6, #9b5cff); border-color: transparent; }
  .btn.primary:disabled { opacity: 0.4; cursor: default; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.ghost { background: none; }
  .card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .card.dirty { border-color: var(--gold); }
  .card h2 { margin: 0; font: 700 18px var(--display); }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .id { color: var(--dim); font: 500 12px ui-monospace, monospace; }
  .tag { padding: 2px 8px; border-radius: 999px; font: 600 11px var(--display); letter-spacing: 0.06em; border: 1px solid currentColor; }
  .tag.on { color: var(--green); } .tag.off { color: var(--dim); }
  .last { margin-left: auto; color: var(--dim); font-size: 12px; }
  .field { display: grid; grid-template-columns: 170px 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; }
  .field label { color: var(--muted); font-size: 13px; }
  .field label small { display: block; color: var(--dim); font-size: 11px; }
  input[type=text], input[type=url] { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line-2); background: #0d0920; color: var(--text); font: 13px ui-monospace, monospace; }
  input:focus { outline: none; border-color: var(--cyan); }
  input.bad { border-color: var(--red); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
  .modes { margin-top: 6px; padding: 14px; border-radius: 10px; background: rgba(0, 0, 0, 0.2); border: 1px dashed var(--line-2); }
  .modes h3 { margin: 0 0 4px; font: 600 13px var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
  .modes p { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
  .mode { display: grid; grid-template-columns: 140px 150px 1fr auto auto; gap: 8px; margin-bottom: 8px; }
  .actions { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 14px; }
  .err { color: var(--red); font-size: 12px; margin-right: auto; }
  .note { padding: 18px 20px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .note b { display: block; margin-bottom: 6px; font: 700 15px var(--display); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line-2); font-weight: 600; z-index: 10; }
  #toast.good { border-color: var(--green); } #toast.bad { border-color: var(--red); }
  @media (max-width: 760px) {
    .field { grid-template-columns: 1fr auto; } .field label { grid-column: 1 / -1; }
    .mode { grid-template-columns: 1fr 1fr; } .mode input[type=url] { grid-column: 1 / -1; }
    .last { margin-left: 0; width: 100%; }
    header h1 { font-size: 13px; letter-spacing: 0.12em; } header .who > span { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1><b>KULT</b> Admin · Game builds</h1>
  <span class="who" id="who"></span>
</header>
<main>
  <p class="intro">Where each legacy game's build lives. Kult World's Game Hub and the Kult browser both read these links, so a change here goes live for players straight away. Links must start with <code>https://</code>. Every save is recorded with your wallet.</p>
  <div id="app"><p class="intro">Loading…</p></div>
</main>
<div id="toast" hidden></div>
<script type="module" src="admin.js"></script>
</body>
</html>
