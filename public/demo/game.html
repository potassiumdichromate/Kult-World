<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kult Create game</title>
<style>
  html, body { margin: 0; height: 100%; background: #07021a; overflow: hidden; touch-action: manipulation; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// A game delivered by a Kult Create studio in demo mode: a tap-to-jump runner
// whose title and colours come from the build (?title=&studio=&seed=).
(() => {
  const q = new URLSearchParams(location.search);
  const title = q.get("title") || "Neon Rush", studio = q.get("studio") || "Kult Create";
  let seed = 0; for (const ch of q.get("seed") || title) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = seed % 360, accent = `hsl(${hue} 95% 62%)`, accent2 = `hsl(${(hue + 160) % 360} 95% 60%)`;
  document.title = title;
  const c = document.getElementById("c"), g = c.getContext("2d");
  let W = 0, H = 0, ground = 0;
  const resize = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; ground = H * 0.78; };
  addEventListener("resize", resize); resize();
  const S = () => H / 640;
  let mode = "menu", t = 0, speed, score, best = 0, player, obs, coins, spawn, stars = Array.from({ length: 60 }, () => [Math.random(), Math.random() * 0.7, Math.random() * 2 + 0.5]);
  const reset = () => { speed = 320; score = 0; player = { y: 0, vy: 0, jumps: 0 }; obs = []; coins = []; spawn = 0.8; };
  reset();
  const jump = () => {
    if (mode === "menu" || mode === "over") { if (mode === "over" && t < 0.5) return; reset(); mode = "play"; t = 0; return; }
    if (player.jumps < 2) { player.vy = -720; player.jumps++; }
  };
  addEventListener("pointerdown", jump);
  addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); } });
  const text = (s, x, y, size, color, align = "center") => { g.font = `800 ${size * S()}px system-ui, sans-serif`; g.textAlign = align; g.fillStyle = color; g.fillText(s, x, y); };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    const k = S(), px = W * 0.2, size = 42 * k;
    if (mode === "play") {
      speed += dt * 14; score += dt * 10;
      player.vy += 2000 * dt; player.y = Math.min(0, player.y + player.vy * dt * k);
      if (player.y === 0) { player.vy = 0; player.jumps = 0; }
      spawn -= dt;
      if (spawn <= 0) { spawn = 0.7 + Math.random() * 0.8; obs.push({ x: W + 20, h: (40 + Math.random() * 50) * k }); if (Math.random() < 0.6) coins.push({ x: W + 160 * k, y: ground - (120 + Math.random() * 120) * k }); }
      for (const o of obs) o.x -= speed * dt * k * 1.2;
      for (const cn of coins) cn.x -= speed * dt * k * 1.2;
      obs = obs.filter((o) => o.x > -60); coins = coins.filter((cn) => cn.x > -60 && !cn.got);
      const py = ground + player.y - size;
      for (const o of obs) if (px + size > o.x && px < o.x + 34 * k && py + size > ground - o.h) { mode = "over"; t = 0; best = Math.max(best, Math.floor(score)); }
      for (const cn of coins) if (Math.abs(cn.x - (px + size / 2)) < 30 * k && Math.abs(cn.y - (py + size / 2)) < 34 * k) { cn.got = true; score += 25; }
    }
    // background
    const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "#0b0330"); grd.addColorStop(1, `hsl(${hue} 60% 14%)`);
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    for (const s of stars) { s[0] = (s[0] - (mode === "play" ? 0.0006 * s[2] : 0.0001) + 1) % 1; g.fillStyle = "rgba(255,255,255,.6)"; g.fillRect(s[0] * W, s[1] * H, s[2] * k * 2, s[2] * k * 2); }
    g.strokeStyle = accent; g.lineWidth = 3 * k; g.shadowColor = accent; g.shadowBlur = 18 * k;
    g.beginPath(); g.moveTo(0, ground); g.lineTo(W, ground); g.stroke();
    for (let x = -(t * speed * k) % (80 * k); x < W; x += 80 * k) { g.globalAlpha = 0.3; g.beginPath(); g.moveTo(x, ground); g.lineTo(x - 120 * k, H); g.stroke(); g.globalAlpha = 1; }
    // coins, obstacles, player
    for (const cn of coins) { g.fillStyle = "#ffd23f"; g.shadowColor = "#ffd23f"; g.beginPath(); g.arc(cn.x, cn.y, 11 * k, 0, 7); g.fill(); }
    g.fillStyle = accent2; g.shadowColor = accent2;
    for (const o of obs) g.fillRect(o.x, ground - o.h, 34 * k, o.h);
    const py = ground + player.y - size;
    g.fillStyle = "#fff"; g.shadowColor = accent; g.fillRect(px, py, size, size);
    g.fillStyle = accent; g.fillRect(px + size * 0.55, py + size * 0.25, size * 0.2, size * 0.2);
    g.shadowBlur = 0;
    // HUD
    text(`${Math.floor(score)}`, W - 24 * k, 50 * k, 30, "#fff", "right");
    text(studio.toUpperCase(), 24 * k, 40 * k, 13, "rgba(255,255,255,.6)", "left");
    if (mode !== "play") {
      g.fillStyle = "rgba(7,2,26,.55)"; g.fillRect(0, 0, W, H);
      text(title.toUpperCase(), W / 2, H * 0.36, Math.min(46, (W / S()) * 0.9 / (title.length * 0.72)), accent);
      const fit = (s, max) => Math.min(max, (W / S()) * 0.9 / (s.length * 0.6));
      const line1 = mode === "over" ? `GAME OVER · ${Math.floor(score)}` : "TAP OR PRESS SPACE TO PLAY";
      const line2 = mode === "over" ? `BEST ${best} · TAP TO RETRY` : "Double-jump the blocks, grab the coins";
      text(line1, W / 2, H * 0.48, fit(line1, 20), "#fff");
      text(line2, W / 2, H * 0.55, fit(line2, 15), "rgba(255,255,255,.75)");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
